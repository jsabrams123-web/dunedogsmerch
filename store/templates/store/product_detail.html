{% extends 'store/base.html' %}
{% load static %}
{% block title %}{{ product.name }} | Dune Dogs World{% endblock %}
{% block content %}
<article class="detail-card">
  <div class="detail-media">
    <img src="{% static product.image.name %}" alt="{{ product.name }}">
  </div>
  <div class="detail-copy">
    <p class="eyebrow">{{ product.category.name }}</p>
    <h1>{{ product.name }}</h1>
    <p class="lead">{{ product.description }}</p>
    <div class="price detail-price">${{ product.price }}</div>
    <form method="post" class="detail-form">
      {% csrf_token %}
      <input type="hidden" name="product" value="{{ product.id }}">
      <button type="submit">Add to Cart</button>
    </form>
    <a class="text-link" href="{% url 'products' %}">Back to shop</a>
  </div>
</article>
{% endblock %}
